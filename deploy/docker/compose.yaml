services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
      DOCKER_INFLUXDB_INIT_RETENTION: 365d
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - monitoring

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - influxdb
    networks:
      - monitoring

  ss4ts-api:
    build:
      context: /opt/ss4ts-noc/backend
      dockerfile: Dockerfile
    container_name: ss4ts-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}

      MIKROTIK_API_USERNAME: ${MIKROTIK_API_USERNAME}
      MIKROTIK_API_PASSWORD: ${MIKROTIK_API_PASSWORD}
      MIKROTIK_API_VERIFY_SSL: ${MIKROTIK_API_VERIFY_SSL}
      MIKROTIK_API_TIMEOUT: ${MIKROTIK_API_TIMEOUT}

      SS4TS_DATA_DIR: /app/data

      SS4TS_CONTROLLED_EXECUTION_ENABLED: "false"
      SS4TS_REAL_DEVICE_READ_ENABLED: "false"
      SS4TS_CONTROLLED_RECOVERY_RUNTIME_ENABLED: "false"

    volumes:
      - /opt/ss4ts-noc/data:/app/data

    depends_on:
      - influxdb
    networks:
      - monitoring

  ss4ts-portal:
    build:
      context: /opt/ss4ts-noc/frontend
      dockerfile: Dockerfile
    container_name: ss4ts-portal
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - ss4ts-api
    networks:
      - monitoring

volumes:
  influxdb_data:
  influxdb_config:
  grafana_data:

networks:
  monitoring:
    driver: bridge
