[agent]
  interval = "30s"
  round_interval = true
  flush_interval = "30s"
  hostname = "mikrotik-monitoring"
  snmp_translator = "gosmi"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# مراقبة سيرفر Ubuntu نفسه
[[inputs.cpu]]
  percpu = true
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]

# مراقبة MikroTik عبر SNMP
[[inputs.snmp]]
  agents = ["udp://10.0.111.250:161"]
  version = 2
  community = "SS4TS-MONITOR"
  timeout = "5s"
  retries = 2
  name = "mikrotik"

  [[inputs.snmp.field]]
    name = "sysName"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "sysUptime"
    oid = "1.3.6.1.2.1.1.3.0"

  [[inputs.snmp.field]]
    name = "sysLocation"
    oid = "1.3.6.1.2.1.1.6.0"
    is_tag = true

  [[inputs.snmp.table]]
    name = "interface"

    [[inputs.snmp.table.field]]
      name = "ifIndex"
      oid = "1.3.6.1.2.1.2.2.1.1"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = "1.3.6.1.2.1.2.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifType"
      oid = "1.3.6.1.2.1.2.2.1.3"

    [[inputs.snmp.table.field]]
      name = "ifMtu"
      oid = "1.3.6.1.2.1.2.2.1.4"

    [[inputs.snmp.table.field]]
      name = "ifSpeed"
      oid = "1.3.6.1.2.1.2.2.1.5"

    [[inputs.snmp.table.field]]
      name = "ifAdminStatus"
      oid = "1.3.6.1.2.1.2.2.1.7"

    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = "1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "ifInOctets"
      oid = "1.3.6.1.2.1.2.2.1.10"

    [[inputs.snmp.table.field]]
      name = "ifInErrors"
      oid = "1.3.6.1.2.1.2.2.1.14"

    [[inputs.snmp.table.field]]
      name = "ifOutOctets"
      oid = "1.3.6.1.2.1.2.2.1.16"

    [[inputs.snmp.table.field]]
      name = "ifOutErrors"
      oid = "1.3.6.1.2.1.2.2.1.20"

# اختبار وصول الراوتر
[[inputs.ping]]
  urls = ["192.168.88.1", "8.8.8.8", "1.1.1.1"]
  count = 4
  ping_interval = 1.0
  timeout = 2.0
  method = "native"

